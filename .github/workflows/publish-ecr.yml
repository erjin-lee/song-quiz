name: Publish ECR Images

# ECS Fargate 이관 1단계(docs/infra/ecs-fargate-migration-plan.md) 전용 워크플로우다.
# deploy-api.yml/deploy-game.yml(EC2 SSH 배포)과는 완전히 별개로 동작하며, 아직 어떤
# 배포에도 연결되지 않는다 - apps/api, apps/game 이미지를 빌드해 ECR에 push하는 것까지만
# 검증한다. main push에 자동으로 걸지 않고 수동 실행(workflow_dispatch)만 허용한다 -
# ECS가 아직 이 이미지를 소비하지 않는 단계에서 커밋마다 이미지를 자동으로 쌓아두지
# 않기 위함이다. 다음 단계(2단계, API ECS 전환)에서 실제 배포에 연결할 때 트리거를
# 다시 검토한다.

on:
  workflow_dispatch:

# 같은 ref에 대한 실행을 직렬화한다 - 동시에 두 번 실행되면 둘 다 "태그 없음"으로 확인한
# 뒤 같은 태그를 push하려다, 먼저 끝난 쪽만 성공하고 나머지는 IMMUTABLE 리포지토리의
# ImageTagAlreadyExistsException으로 실패할 수 있다(check 스텝만으로는 막을 수 없는
# TOCTOU 경합 - 실행 자체를 겹치지 않게 만드는 게 유일한 해결책).
concurrency:
  group: publish-ecr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        service: [api, game]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ECR_PUSH_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # ECR 리포지토리가 IMMUTABLE이라 이미 존재하는 태그를 다시 push하면
      # ImageTagAlreadyExistsException으로 실패한다 - 같은 커밋으로 워크플로우를
      # 재실행하거나(예: api/game 중 한쪽만 실패해서 전체를 다시 돌리는 경우) 이미
      # 성공한 쪽까지 실패 처리되지 않도록, push 전에 태그 존재 여부를 먼저 확인해
      # 이미 있으면 빌드/푸시를 건너뛴다.
      - name: Check if image tag already exists
        id: check
        env:
          REPOSITORY: deploy-terraform-${{ matrix.service }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set +e
          error_output="$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$TAG" 2>&1 >/dev/null)"
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image $REPOSITORY:$TAG already exists - skipping build/push."
          elif printf '%s' "$error_output" | grep -q "ImageNotFoundException"; then
            # 태그가 실제로 없는 정상 케이스에서만 빌드를 진행한다.
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # 권한 부족(AccessDeniedException), 리포지토리 미생성
            # (RepositoryNotFoundException), throttling 등은 "이미지 없음"과 다르다 -
            # 이걸 이미지 없음으로 오판하면 원인 모를 채로 빌드가 진행되다 마지막 push
            # 단계에서 엉뚱한 IMMUTABLE 태그 오류로 실패해 진짜 원인이 가려진다.
            echo "$error_output" >&2
            echo "::error::aws ecr describe-images failed for $REPOSITORY:$TAG (not ImageNotFoundException) - stopping instead of assuming the image doesn't exist" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # 리포지토리 이름(deploy-terraform-api/-game)은 infra/terraform/modules/ecr의
          # "${var.project_name}-api"/"${var.project_name}-game"과 반드시 같은 값이어야 한다
          # (var.project_name의 실제 값은 "deploy-terraform" - environments/prod/providers.tf
          # 참고). ECR 리포지토리 자체는 이 워크플로우가 아니라 terraform apply로 미리
          # 만들어져 있어야 한다(1단계 작업 범위).
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/deploy-terraform-${{ matrix.service }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
