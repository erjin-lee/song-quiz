name: Deploy Alarm Notifier Lambda

# deploy-api.yml/deploy-game.yml과 같은 패턴: terraform apply 없이 코드만 빠르게 배포한다.
# 인프라(환경변수/IAM/timeout 등)는 이 워크플로우가 건드리지 않는다 - 그건 여전히
# infra/terraform/environments/prod에서 로컬로 직접 terraform apply해야 한다
# (infra/terraform/modules/notification/lambda.tf의 lifecycle.ignore_changes 참고).
on:
  push:
    branches: [main]
    paths:
      - 'apps/lambda/alarm-notifier/**'
      - 'package.json'
      - 'yarn.lock'
      - 'turbo.json'
  workflow_dispatch:

concurrency:
  group: deploy-alarm-notifier-lambda
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC로 AWS IAM Role을 assume하기 위해 필요

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: |
          corepack enable
          YARN_ENABLE_IMMUTABLE_INSTALLS=true yarn workspaces focus alarm-notifier
          yarn workspace alarm-notifier build

      # 테스트가 실패하는 코드가 그대로 운영 Lambda에 배포되지 않도록, zip을 만들기 전에
      # 반드시 통과해야 한다.
      - name: Test
        run: yarn workspace alarm-notifier test

      # terraform의 data "archive_file"(source_dir = dist)과 동일하게, dist/ 안의 내용을
      # zip 루트에 바로 담는다(dist 폴더 자체를 zip 안에 포함하지 않음).
      - name: Zip build output
        run: |
          cd apps/lambda/alarm-notifier/dist
          zip -r ../deploy.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_LAMBDA_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name song-quiz-prod-alarm-notifier \
            --zip-file fileb://apps/lambda/alarm-notifier/deploy.zip \
            --no-cli-pager
          aws lambda wait function-updated \
            --function-name song-quiz-prod-alarm-notifier
