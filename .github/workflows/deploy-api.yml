name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/logger/**'
      - 'packages/tracing/**'
      - 'package.json'
      - 'yarn.lock'
      - 'turbo.json'
  workflow_dispatch:

concurrency:
  group: deploy-was
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/bastion_key
          echo "${{ secrets.WAS_SSH_KEY }}" > ~/.ssh/was_key

          chmod 600 ~/.ssh/bastion_key ~/.ssh/was_key

          cat >> ~/.ssh/config <<EOF
          Host bastion
            HostName ${{ secrets.BASTION_HOST }}
            User ${{ secrets.BASTION_USER }}
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host was
            HostName ${{ secrets.WAS_HOST }}
            User ${{ secrets.WAS_USER }}
            IdentityFile ~/.ssh/was_key
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy API and verify readiness
        run: |
          ssh was bash -s -- \
            "${{ secrets.WAS_APP_DIR }}" \
            "${{ vars.API_LOCAL_READY_URL }}" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$1"
          HEALTH_URL="$2"

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          cd "$APP_DIR"

          PREVIOUS_SHA="$(git rev-parse HEAD)"

          echo "Previous commit: $PREVIOUS_SHA"

          # 배포 서버에 예상하지 못한 변경이 있다면 배포하지 않는다.
          if [ -n "$(git status --porcelain)" ]; then
            echo "WAS working tree is not clean."
            git status --short
            exit 1
          fi

          build_api() {
            cd "$APP_DIR"

            corepack enable

            YARN_ENABLE_IMMUTABLE_INSTALLS=true yarn workspaces focus api

            yarn workspace logger build
            yarn workspace tracing build
            yarn workspace api build
          }

          reload_api() {
            local commit_sha="$1"

            cd "$APP_DIR/apps/api"

            COMMIT_SHA="$commit_sha" \
            pm2 startOrReload ecosystem.config.js --update-env
          }

          check_readiness() {
            local expected_sha="$1"

            # 최대 약 60초 동안 readiness 확인
            for attempt in $(seq 1 12); do
              echo "Readiness check $attempt/12..."

              if response="$(curl -fsS --max-time 3 "$HEALTH_URL" 2>/dev/null)"; then
                if parsed="$(
                  printf '%s' "$response" |
                  node -e '
                    let body = "";

                    process.stdin.on("data", chunk => body += chunk);

                    process.stdin.on("end", () => {
                      try {
                        const data = JSON.parse(body);

                        process.stdout.write(
                          `${data.status ?? ""}\t${data.service ?? ""}\t${data.commitSha ?? ""}`
                        );
                      } catch {
                        process.exit(1);
                      }
                    });
                  '
                )"; then
                  IFS=$'\t' read -r status service health_sha <<< "$parsed"

                  echo "status=$status service=$service commitSha=$health_sha"

                  # health endpoint가 short SHA를 반환해도 검증할 수 있도록 prefix 비교
                  if \
                    [ "$status" = "ok" ] && \
                    [ "$service" = "api" ] && \
                    [ -n "$health_sha" ] && \
                    [[ "$expected_sha" == "$health_sha"* ]]; then

                    echo "API readiness check passed."
                    return 0
                  fi
                fi
              fi

              sleep 5
            done

            return 1
          }

          echo "Pull latest main..."

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          DEPLOYED_SHA="$(git rev-parse HEAD)"

          echo "Deploying commit: $DEPLOYED_SHA"

          build_api
          reload_api "$DEPLOYED_SHA"

          if check_readiness "$DEPLOYED_SHA"; then
            echo "API deployment succeeded."
            exit 0
          fi

          #
          # Readiness 실패 → 이전 production commit으로 rollback
          #
          echo "API readiness check failed."
          echo "Rolling back to $PREVIOUS_SHA..."

          cd "$APP_DIR"

          git reset --hard "$PREVIOUS_SHA"

          build_api
          reload_api "$PREVIOUS_SHA"

          if check_readiness "$PREVIOUS_SHA"; then
            echo "Rollback succeeded."
          else
            echo "CRITICAL: rollback readiness check also failed."
            exit 2
          fi

          # rollback은 성공했어도 이번 배포 자체는 실패 처리
          exit 1
          REMOTE

      # 위 readiness까지 성공한 경우에만 이후 단계 실행
      - name: Get deployed commit SHA from WAS
        id: deployed_sha
        run: |
          DEPLOYED_SHA="$(
            ssh was 'cd "${{ secrets.WAS_APP_DIR }}" && git rev-parse HEAD'
          )"

          echo "sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      # readiness까지 검증된 production commit만 metadata로 기록한다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_METADATA_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Record deployment metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/write-deployment-metadata.sh \
            api \
            /song-quiz/prod/deployment/api \
            "${{ steps.deployed_sha.outputs.sha }}"